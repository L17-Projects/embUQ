# Reduced Production Configuration (Indentation)

emb_diameters:
  - 3.2
  - 5.8
  - 3.4

experiment: indentation
data_dir: emb/indentation/evalkit/data
data_prefix: indentation_data_
data_files:
  3.2: data_morris_3.19.csv
  5.8: data_morris_5.76.csv
  3.4: data_morris_3.40.csv
surrogate_dir: emb/indentation/surrogate/diameters

frac_diam: 0.2
use_surrogate: true
surrogate:
  backend: dnn
  predictive_mc_samples: 32
  predictive_mc_chunk_size: 8

fixed_params:
  b1: 0.0
  b2: 0.0
  a3: 0.0
  a4: 0.0

pop_size: 50000
max_gen: -1
target_cov: 0.8
covariance_scaling: 0.04
phase1_burn_in: 1

prior_Yt: [100000.0, 1000000000.0]
prior_kb: [400.0, 70000.0]
prior_d0: [-0.5, 0.5]
prior_sigma: [0.0, 1.0]

hbi_pop_size: 50000
hbi_burn_in: 1
hbi_target_cov: 0.6
hbi_covariance_scaling: 0.04
phase2_backend: native-cuda

phase3b_pop_size: 50000
phase3b_max_gen: -1
phase3b_target_cov: 0.8
phase3b_covariance_scaling: 0.04

hyperprior_mu_Yt: [100000.0, 50000000.0]
hyperprior_sigma_Yt: [0.0, 50000000.0]
hyperprior_mu_kb: [800.0, 50000.0]
hyperprior_sigma_kb: [0.0, 500.0]
hyperprior_mu_d0: [-0.5, 0.5]
hyperprior_sigma_d0: [0.0, 0.3]

out: out_reduced
debug: 0
dump: false
map_n_displacements: 15

description: "paper-facing | reduced-model | indentation | o369 | 2026-04-18"
