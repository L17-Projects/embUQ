primary_source:
  repository: BrieucB/UQ_DPD
  branch: master
  reconcile_missing_master_commits: false

layout:
  package_root: src/meso_uq
  workflow_dirs_at_root: true
  korali_root: extern/korali

include:
  stable_root:
    - Hierarchical_UQ_compression
  dev_root:
    - Hierarchical_UQ_compression_dev
  korali_root:
    - korali

exclude:
  - '**/_paper/**'
  - '**/markdowns/**'
  - '**/.pytest_cache/**'
  - '**/__pycache__/**'
  - '**/.coverage*'
  - '**/.vscode/**'
  - '**/slurm-*.out'
  - '**/slurm-*.err'
  - '**/_logs/**'
  - '**/_runs/**'
  - '**/_setup/**'
  - '**/_setup_test/**'
  - '**/docs/_build/**'

filters:
  use_git_lfs_for_large_binaries_if_needed: true
  defer_nonessential_large_artifacts: true
