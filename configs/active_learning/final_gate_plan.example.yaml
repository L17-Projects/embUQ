schema_version: "1.0"
kind: active_learning
metadata:
  id: final_gate_plan
  name: Active Learning Final Gate Plan
spec:
  target:
    modality: indentation
    diameter_um: 3.4
    use_prior_training_data: false
  candidate_dimensions:
    ka:
      min: 100.0
      max: 600000.0
    kb:
      min: 400.0
      max: 70000.0
  runtime_parameterization:
    active_controls:
      - ka
      - kb
    legacy_derived_controls:
      - Yt
  active_learning:
    rounds: 3
    curves_per_round: 30
    full_force_sweep: true
    round_plan:
      - index: 1
        source: initial_sobol_maximin
        sample_count: 30
      - index: 2
        source: ensemble_disagreement_diversity
        exploration_count: 6
        acquisition_count: 24
        source_distribution:
          exploration: 6
          ensemble_disagreement_diversity: 24
      - index: 3
        source: ensemble_disagreement_diversity
        exploration_count: 6
        acquisition_count: 24
        source_distribution:
          exploration: 6
          ensemble_disagreement_diversity: 24
    comparator:
      type: lhs
      curve_count: 90
      al_prefixes: [30, 60, 90]
      lhs_prefixes: [30, 60, 90]
  canary:
    curves: 1
    force_points: 3
  platform:
    name: karolina
    concurrent_jobs: 30
    retry_limit: 3
  candidate_selection:
    sampling: log10
    source_constraints:
      prior_training_data: false
      fresh_dpd_labels_only: true
  runtime_fingerprint:
    radp: 6.80
    L: 25
    fscale: 0.0074
    shell_th: 0.000000005
    numsteps: 5000
    numsteps_eq: 10000
    force_grid_um_3_4:
      - 0.0
      - 357.14285714285717
      - 714.2857142857143
      - 1071.4285714285716
      - 1428.5714285714287
      - 1785.7142857142858
      - 2142.857142857143
      - 2500.0
      - 2857.1428571428573
      - 3214.2857142857147
      - 3571.4285714285716
      - 3928.571428571429
      - 4285.714285714286
      - 4642.857142857143
      - 5000.0
    force_grid_input: samples_all.dat
    force_grid_mode: only
  required_plots:
    - runtime_per_curve
    - samples_ka_kb
    - per_round_additions
    - exploration_vs_acquisition
    - disagreement_acquisition_map
    - force_curve_overlays
    - al_vs_lhs_relative_l2
    - failure_quarantine_replacement
