schema_version: "1.0"
kind: platform
metadata:
  id: karolina
  name: Karolina
platform_key: karolina
spec:
  scheduler: slurm
  submission:
    launcher: sbatch
    account_env: MESOUQ_SLURM_ACCOUNT
    partition_env: MESOUQ_SLURM_PARTITION
    qos_env: MESOUQ_SLURM_QOS
    time_limit: "24:00:00"
  paths:
    runtime_root: ${MESOUQ_SITE_RUNTIME_ROOT}
    runs_root: ${MESOUQ_RUNS_ROOT}/karolina
    scratch_root: ${MESOUQ_SCRATCH_ROOT}
    korali_vendor_root: extern/korali
path_policy:
  allow_absolute_paths: false
  canonical_runs_root: ${MESOUQ_SCRATCH_ROOT}/runs
  required_placeholders:
    - ${MESOUQ_REPO_ROOT}
    - ${MESOUQ_RUNS_ROOT}
    - ${MESOUQ_SCRATCH_ROOT}
    - ${MESOUQ_SITE_RUNTIME_ROOT}
  forbidden_path_prefixes:
    - /ceph/hpc/home/eubrieucb
  gpu_resource_syntax:
    - --gpus
    - --gpus-per-task
  environment_scripts:
    - ${MESOUQ_SITE_RUNTIME_ROOT}/env/env.sh
    - ${MESOUQ_SITE_RUNTIME_ROOT}/korali/env.sh
    - ${MESOUQ_SITE_RUNTIME_ROOT}/mirheo/env.sh
    - ${MESOUQ_SITE_RUNTIME_ROOT}/mirheoOBMD/env.sh
    - ${MESOUQ_SITE_RUNTIME_ROOT}/gv_cgal_tools/env.sh
  forbidden_literals:
    - /ceph/hpc/home/eubrieucb
