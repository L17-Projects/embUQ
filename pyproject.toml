[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesouq"
version = "0.1.0"
description = "Bayesian uncertainty quantification and calibration of mesoscopic DPD models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Brieuc Benvegnen"}
]
keywords = ["bayesian-inference", "uncertainty-quantification", "dpd", "mesoscopic-models", "hierarchical-bayesian-inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering"
]

dependencies = [
  "numpy>=1.26"
]

[project.urls]
Repository = "https://github.com/BrieucB/MesoUQ"
Issues = "https://github.com/BrieucB/MesoUQ/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["meso_uq*"]

[tool.pytest.ini_options]
addopts = ["-ra", "--tb=short"]
testpaths = ["tests"]
