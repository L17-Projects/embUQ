#BOX
Lx: 25.0
Ly: 25.0
Lz: 25.0

#SIMULATION
numsteps_eq: 100000
numsteps: 100000
dt_eq: 0.00005
dt: 0.00005
stslik: 100
stslik_eq: 100

#UNITS
ul: 35.0e-9
kbol: 1.3805e-23
t0: 300.0
rho_water: 997.0 
rho_gas: 3.72
rho_shell: 1320.0
shell_th: 2.0e-9
th_fac: 1.0
energyFactor: 1.0

#ELASTICITY
#For isotropic elasticity specify Yt
#For anisotropic specify both Yt and Yl
fscale: 0.079 #0.079
Yt: 1.0e+9
Yl: 4.0e+9
nu: 0.3
a3: 0.0
a4: 0.0
b1: 0.0
b2: 0.0
theta: 0.0
kb_fac: 1.0
yt_fac: 1.0

#DPD
facg: 1.0
bpress: 0.0
aii: 100.0
alpha: 0.101
gamma_dpd: 18.0
gamma_dpd_gas: 12.0
strong: 1.0
rc: 1.0
s: 0.125
s_g: 0.0
k_fsi: 0.5
rhow: 3.0
rhog: 3.0
visg: 1.732e-5
visw: 8.9e-4
lj_fac: 0.1

# Number of bubbles or gas vesicles: should be 2^n (1,2,4,8,16,...)
numObjects: 1
objFile: gv.off
#sphere_icosphere.off

#Bubble
radp: 4.0
subDiv: 4

#GV
radGV: 2.0
height: 14.28 # 14.28

#Area, volume
ka_tot: 0.0 
kv_tot: 0.0 

#Viscoelasticity
gammaC: 0.0

#Buckling
buck: 0.0
fbuck: 0.75

#Stretch
force: 0.0
tot_force: 0.0
fraction: 0.2

#OBMD parameters 
#bufferSize = 0.15 means 0.15 * Lx
# bufferTau = 10.0 means 10.0 * dt
obmd_flag: 1
bufferSize: 0.15
bufferTau: 10.0 
bufferAlpha: 0.6
ptan: 0.5
