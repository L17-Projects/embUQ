name: Release Smoke

on:
  push:
    branches: [main, bootstrap/**, release-hardening/**]
  pull_request:
    branches: [main, bootstrap/**, release-hardening/**]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install CI extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Build package metadata
        run: python -m build --sdist --wheel

      - name: Run public release smoke tests
        run: |
          pytest tests/test_postprocess_smoke.py tests/test_surrogate_smoke.py

      - name: Upload release smoke dist artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-smoke-dist
          path: dist
          if-no-files-found: warn
          retention-days: 14

  docs-link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release docs and governance metadata
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f docs/README.md
          test -f docs/RELEASE_EVIDENCE_CHECKLIST_v0.1.0.md
          test -f docs/VALIDATION_MATRIX.md
          test -f docs/WORKSTATION_ACCEPTANCE_CHECKLIST.md
          test -f docs/VEGA_ACCEPTANCE_CHECKLIST.md
          test -f .github/CODEOWNERS
          test -f .github/dependabot.yml
