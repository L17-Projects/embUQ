name: Release Smoke

on:
  push:
    branches: [main, bootstrap/**, release-hardening/**]
  pull_request:
    branches: [main, bootstrap/**, release-hardening/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install CI extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Build package metadata
        run: python -m build --sdist --wheel

      - name: Run public release smoke tests
        run: |
          pytest tests/test_postprocess_smoke.py tests/test_surrogate_smoke.py

      - name: Upload release smoke dist artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-dist
          path: dist
          if-no-files-found: warn
          retention-days: 14

  docs-link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release docs presence
        run: |
          test -f README.md
          test -f docs/README.md
          test -f docs/VALIDATION_MATRIX.md
          test -f docs/VEGA_ACCEPTANCE_CHECKLIST.md
