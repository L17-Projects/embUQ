name: Release Smoke

on:
  push:
    branches: [main, bootstrap/**, release-hardening/**]
  pull_request:
    branches: [main, bootstrap/**, release-hardening/**]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install CI extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Build package metadata
        run: python -m build --sdist --wheel

      - name: Run public release smoke tests
        run: |
          pytest tests/test_postprocess_smoke.py tests/test_surrogate_smoke.py

      - name: Upload release smoke dist artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-smoke-dist
          path: dist
          if-no-files-found: warn
          retention-days: 14

  docs-link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Validate release docs and governance metadata
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f docs/README.md
          test -f docs/RELEASE_EVIDENCE_CHECKLIST_v0.1.0.md
          test -f docs/VALIDATION_MATRIX.md
          test -f docs/WORKSTATION_ACCEPTANCE_CHECKLIST.md
          test -f docs/VEGA_ACCEPTANCE_CHECKLIST.md
          test -f .github/CODEOWNERS
          test -f .github/dependabot.yml
