name: Release Smoke

on:
  push:
    branches: [main, bootstrap/**]
  pull_request:
    branches: [main]

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scientific test stack
        run: |
          python -m pip install --upgrade pip
          pip install build pytest pandas matplotlib scipy torch
          pip install -e .

      - name: Build package metadata
        run: python -m build --sdist --wheel

      - name: Run public release smoke tests
        run: |
          pytest tests/test_postprocess_smoke.py tests/test_surrogate_smoke.py

  docs-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release docs presence
        run: |
          test -f README.md
          test -f docs/README.md
          test -f docs/VALIDATION_MATRIX.md
          test -f docs/VEGA_ACCEPTANCE_CHECKLIST.md
