name: CI

on:
  push:
    branches: [main, bootstrap/**, release-hardening/**]
  pull_request:
    branches: [main, bootstrap/**, release-hardening/**]

jobs:
  package-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Build package metadata
        run: python -m build --sdist --wheel

      - name: Run unit tests
        run: pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate docs links
        run: python scripts/ci/check_docs_links.py

  mpi-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MPI stack
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip
          pip install -e ".[mpi]"

      - name: MPI smoke test
        run: |
          mpirun --oversubscribe -np 2 python -c "from mpi4py import MPI; comm = MPI.COMM_WORLD; print(f'rank {comm.Get_rank()} / {comm.Get_size()}')"

  retraining-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CI extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Run surrogate retraining canary
        run: python scripts/ci/run_retraining_canary.py

  workflow-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workflow canary system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev pkg-config libgsl-dev libeigen3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci,mpi]"

      - name: Bootstrap repo-local Korali
        run: bash scripts/vega/bootstrap_korali.sh --jobs 2

      - name: Run real CPU workflow canary
        shell: bash
        run: |
          source _vega/korali/env.sh
          python scripts/ci/run_workflow_canary.py --cpu-ranks 2
