name: CI

on:
  push:
    branches: [main, bootstrap/**, release-hardening/**]
  pull_request:
    branches: [main, bootstrap/**, release-hardening/**]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Build package metadata
        run: python -m build --sdist --wheel

      - name: Run installed package smoke
        run: python scripts/ci/run_installed_package_smoke.py --wheel dist

      - name: Run unit tests with coverage
        shell: bash
        run: |
          set +e
          python -m coverage run -m pytest
          test_status=$?
          python -m coverage report --skip-covered
          python -m coverage xml -o coverage.xml
          python -m coverage json -o coverage.json
          exit $test_status

      - name: Preserve head coverage report
        if: always()
        shell: bash
        run: |
          test -f coverage.json
          cp coverage.json coverage-head.json

      - name: Restore base coverage cache
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')
        id: base-coverage-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-base-coverage/coverage-base.json
          key: base-coverage-${{ runner.os }}-py311-${{ github.event.pull_request.base.sha }}

      - name: Detect coverage-sensitive changes
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')
        id: coverage-scope
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags --depth=1 origin "$base_sha" "$head_sha"
          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

          if printf "%s\n" "$changed_files" | rg -qE '^(src/|tests/|scripts/ci/|pyproject.toml|setup\\.py|setup\\.cfg)$'; then
            echo "run_coverage_gate=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_coverage_gate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute base branch coverage
        if: success() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          cache_dir=".ci-base-coverage"
          cache_file="${cache_dir}/coverage-base.json"
          cache_hit="${{ steps.base-coverage-cache.outputs.cache-hit }}"

          validate_coverage_json() {
            local candidate_file="$1"
            python -c "import json, pathlib, sys; payload = json.loads(pathlib.Path('$candidate_file').read_text(encoding='utf-8')); assert isinstance(payload, dict); assert isinstance(payload.get('files'), dict) or isinstance(payload.get('totals'), dict)"
          }

          if [[ "${cache_hit}" == "true" && -f "${cache_file}" && -s "${cache_file}" ]]; then
            if validate_coverage_json "${cache_file}"; then
              cp "${cache_file}" coverage-base.json
              echo "Using cached base coverage for ${base_sha}."
              exit 0
            fi
            echo "Cached base coverage is invalid. Recomputing."
          fi

          worktree_dir="../base-coverage-${{ github.run_id }}-${{ github.run_attempt }}"
          git fetch --no-tags --depth=1 origin "$base_sha"
          git worktree add "$worktree_dir" "$base_sha"
          pushd "$worktree_dir"
          pip install -e ".[test]"
          python -m coverage run -m pytest
          python -m coverage json -o coverage-base.json
          popd
          test -f "$worktree_dir/coverage-base.json"
          mkdir -p "$cache_dir"
          cp "$worktree_dir/coverage-base.json" "$cache_file"
          cp "$cache_file" coverage-base.json
          git worktree remove "$worktree_dir" --force

      - name: Enforce feedback coverage increase
        if: success() && github.event_name == 'pull_request' && steps.coverage-scope.outputs.run_coverage_gate == 'true'
        shell: bash
        run: |
          test -f coverage-head.json
          test -f coverage-base.json
          python scripts/ci/check_coverage_increase.py \
            --base-json coverage-base.json \
            --head-json coverage-head.json \
            --markdown-path coverage-delta.md
          cat coverage-delta.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Summarize coverage report
        if: always()
        shell: bash
        run: |
          if [ -f coverage.json ]; then
            python scripts/ci/summarize_coverage.py --json-path coverage.json --markdown-path coverage-summary.md
            cat coverage-summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "coverage.json not found" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.json
            coverage-head.json
            coverage-base.json
            coverage-delta.md
            coverage-summary.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          slug: BrieucB/MesoUQ
          files: coverage.xml
          disable_search: true
          codecov_yml_path: codecov.yml
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Validate docs links
        run: python scripts/ci/check_docs_links.py

  platform-interface-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        site: [vega, karolina]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Vega/Karolina platform-interface gate
        env:
          MESOUQ_SITE: ${{ matrix.site }}
        run: |
          python -m pytest -q \
            tests/test_hpc_shared_script_governance.py \
            tests/test_script_path_governance.py \
            tests/test_repository_governance.py \
            tests/test_karolina_validation_matrix.py \
            tests/test_vega_matrix_sbatch.py \
            tests/test_validation_matrix.py \
            tests/unit/test_hpc_paths.py \
            tests/unit/test_platform_configs.py \
            tests/unit/test_platform_policies.py \
            tests/unit/test_gv_platform_routing.py \
            tests/unit/test_dpd_production_preflight.py

  bnn-backend-canary:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Run BNN backend canary
        run: python scripts/ci/run_bnn_backend_canary.py

  mpi-smoke:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install MPI stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip
          pip install -e ".[mpi]"

      - name: MPI smoke test
        run: |
          mpirun --oversubscribe -np 2 python -c "from mpi4py import MPI; comm = MPI.COMM_WORLD; print(f'rank {comm.Get_rank()} / {comm.Get_size()}')"

  retraining-canary:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install CI extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Run surrogate retraining canary
        run: python scripts/ci/run_retraining_canary.py

      - name: Summarize retraining canary outputs
        if: always()
        shell: bash
        run: |
          if [ -d _ci/surrogate_retraining ]; then
            find _ci/surrogate_retraining -maxdepth 3 -type f | sort
          else
            echo "_ci/surrogate_retraining not found"
          fi

      - name: Upload retraining canary artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retraining-canary
          path: _ci/surrogate_retraining
          if-no-files-found: warn
          retention-days: 14

  workflow-canary:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MESOUQ_SITE: vega
      MESOUQ_SITE_RUNTIME_ROOT: ${{ github.workspace }}/_ci/vega-runtime
      MESOUQ_PROVENANCE_ROOT: ${{ github.workspace }}/_ci/provenance
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Restore Korali runtime cache
        id: korali-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _ci/vega-runtime/env
            _ci/vega-runtime/korali/install
            _ci/vega-runtime/korali/env.sh
            extern/korali/subprojects/packagecache
          key: workflow-canary-v2-korali-${{ runner.os }}-py311-${{ hashFiles('.github/workflows/ci.yml', 'extern/korali/**', 'scripts/platforms/hpc/bootstrap_env.sh', 'scripts/platforms/hpc/bootstrap_korali.sh', 'src/meso_uq/vega.py') }}

      - name: Report Korali cache state
        shell: bash
        run: |
          echo "korali_cache_hit=${{ steps.korali-cache.outputs.cache-hit }}"
          if [ -d "${MESOUQ_SITE_RUNTIME_ROOT}/korali/install" ]; then
            du -sh "${MESOUQ_SITE_RUNTIME_ROOT}/korali/install" || true
          else
            echo "${MESOUQ_SITE_RUNTIME_ROOT}/korali/install not present yet"
          fi

      - name: Install workflow canary system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openmpi-bin libopenmpi-dev pkg-config libgsl-dev libeigen3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pybind11 meson ninja
          pip install -e ".[ci,mpi]"

      - name: Bootstrap canonical Korali runtime
        if: steps.korali-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/platforms/hpc/bootstrap_env.sh \
            --site vega \
            --system-site-packages \
            --skip-python-deps \
            --with-korali

      - name: Validate canonical Korali runtime
        shell: bash
        run: |
          test -f "${MESOUQ_SITE_RUNTIME_ROOT}/env/env.sh"
          source "${MESOUQ_SITE_RUNTIME_ROOT}/env/env.sh"
          python - <<'PY'
          import korali
          import matplotlib
          import meso_uq
          import mpi4py
          import pandas
          import torch
          import yaml

          print(f"canonical env python deps ok: {meso_uq.__file__}")
          print(f"korali import ok: {korali.__file__}")
          PY

      - name: Run real CPU workflow canary
        shell: bash
        run: |
          source "${MESOUQ_SITE_RUNTIME_ROOT}/env/env.sh"
          python scripts/ci/run_workflow_canary.py --cpu-ranks 2

      - name: Summarize workflow canary outputs
        if: always()
        shell: bash
        run: |
          if [ -d _ci/workflow_canary ]; then
            find _ci/workflow_canary -maxdepth 4 -type f | sort
          else
            echo "_ci/workflow_canary not found"
          fi

      - name: Upload workflow canary artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-canary
          path: _ci/workflow_canary
          if-no-files-found: warn
          retention-days: 14
