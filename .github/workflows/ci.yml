name: CI

on:
  push:
    branches: [main, bootstrap/**, release-hardening/**]
  pull_request:
    branches: [main, bootstrap/**, release-hardening/**]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Build package metadata
        run: python -m build --sdist --wheel

      - name: Run unit tests with coverage
        shell: bash
        run: |
          set +e
          python -m coverage run -m pytest
          test_status=$?
          python -m coverage report --skip-covered
          python -m coverage xml -o coverage.xml
          python -m coverage json -o coverage.json
          exit $test_status

      - name: Summarize coverage report
        if: always()
        shell: bash
        run: |
          if [ -f coverage.json ]; then
            python scripts/ci/summarize_coverage.py --json-path coverage.json --markdown-path coverage-summary.md
            cat coverage-summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "coverage.json not found" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.json
            coverage-summary.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          use_oidc: true
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Validate docs links
        run: python scripts/ci/check_docs_links.py

  mpi-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install MPI stack
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip
          pip install -e ".[mpi]"

      - name: MPI smoke test
        run: |
          mpirun --oversubscribe -np 2 python -c "from mpi4py import MPI; comm = MPI.COMM_WORLD; print(f'rank {comm.Get_rank()} / {comm.Get_size()}')"

  retraining-canary:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install CI extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Run surrogate retraining canary
        run: python scripts/ci/run_retraining_canary.py

      - name: Summarize retraining canary outputs
        if: always()
        shell: bash
        run: |
          if [ -d _ci/surrogate_retraining ]; then
            find _ci/surrogate_retraining -maxdepth 3 -type f | sort
          else
            echo "_ci/surrogate_retraining not found"
          fi

      - name: Upload retraining canary artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: retraining-canary
          path: _ci/surrogate_retraining
          if-no-files-found: warn
          retention-days: 14

  workflow-canary:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Restore Korali runtime cache
        id: korali-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            _vega/korali/install
            _vega/korali/env.sh
            extern/korali/subprojects/packagecache
          key: korali-${{ runner.os }}-py311-${{ hashFiles('extern/korali/**', 'scripts/vega/bootstrap_korali.sh', 'src/meso_uq/vega.py') }}

      - name: Report Korali cache state
        shell: bash
        run: |
          echo "korali_cache_hit=${{ steps.korali-cache.outputs.cache-hit }}"
          if [ -d _vega/korali/install ]; then
            du -sh _vega/korali/install || true
          else
            echo "_vega/korali/install not present yet"
          fi

      - name: Install workflow canary system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev pkg-config libgsl-dev libeigen3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pybind11 meson ninja
          pip install -e ".[ci,mpi]"

      - name: Bootstrap repo-local Korali
        if: steps.korali-cache.outputs.cache-hit != 'true'
        run: bash scripts/vega/bootstrap_korali.sh --skip-python-build-deps

      - name: Validate repo-local Korali runtime
        run: test -f _vega/korali/env.sh

      - name: Run real CPU workflow canary
        shell: bash
        run: |
          source _vega/korali/env.sh
          python scripts/ci/run_workflow_canary.py --cpu-ranks 2

      - name: Summarize workflow canary outputs
        if: always()
        shell: bash
        run: |
          if [ -d _ci/workflow_canary ]; then
            find _ci/workflow_canary -maxdepth 4 -type f | sort
          else
            echo "_ci/workflow_canary not found"
          fi

      - name: Upload workflow canary artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: workflow-canary
          path: _ci/workflow_canary
          if-no-files-found: warn
          retention-days: 14
