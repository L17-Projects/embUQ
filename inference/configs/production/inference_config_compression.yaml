# Hierarchical Bayesian Inference Configuration
# Production compression workflow

emb_diameters:
  - 2.1
  - 2.9
  - 3.0

experiment: compression
data_dir: emb/compression/evalkit/data
data_prefix: compression_data_
surrogate_dir: emb/compression/surrogate/diameters

frac_diam: 0.2
use_surrogate: true
surrogate:
  backend: dnn
  predictive_mc_samples: 32
  predictive_mc_chunk_size: 8

pop_size: 50000
max_gen: -1
target_cov: 0.8
covariance_scaling: 0.04
phase1_burn_in: 1

prior_Yt: [10000000.0, 50000000.0]
prior_kb: [100.0, 1000.0]
prior_b1: [0.0, 3.0]
prior_b2: [0.0, 10.0]
prior_a3: [-2.5, 3.0]
prior_a4: [0.0, 4.0]
prior_d0: [0.0, 0.5]
prior_sigma: [0.0, 1.0]

hbi_pop_size: 50000
hbi_burn_in: 1
hbi_target_cov: 0.6
hbi_covariance_scaling: 0.04
phase2_backend: native-cuda

phase3b_pop_size: 50000
phase3b_max_gen: -1
phase3b_target_cov: 0.8
phase3b_covariance_scaling: 0.04

map_n_displacements: 15

hyperprior_mu_Yt: [10000000.0, 50000000.0]
hyperprior_sigma_Yt: [0.0, 50000000.0]
hyperprior_mu_kb: [100.0, 1000.0]
hyperprior_sigma_kb: [0.0, 500.0]
hyperprior_mu_b1: [0.0, 3.0]
hyperprior_sigma_b1: [0.0, 3.0]
hyperprior_mu_b2: [0.0, 10.0]
hyperprior_sigma_b2: [0.0, 10.0]
hyperprior_mu_a3: [-2.5, 3.0]
hyperprior_sigma_a3: [0.0, 5.0]
hyperprior_mu_a4: [0.0, 4.0]
hyperprior_sigma_a4: [0.0, 4.0]
hyperprior_mu_d0: [0.0, 0.5]
hyperprior_sigma_d0: [0.0, 0.3]

out: out_hierarchical
debug: 0
dump: false
description: "paper-facing | full-model | compression | o369 | 2026-04-18"
