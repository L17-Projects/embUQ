# GV hierarchical inference fixture for a single selected experiment.

structure: gv
structures: [gv]
experimental_gv_hbi: true

surrogate:
  backend: dnn
  predictive_mc_samples: 16
  predictive_mc_chunk_size: 4

calibrated_parameters:
  - ka
  - kb
  - mu
  - b1
  - b2
  - a3
  - a4
  - mu_l
  - c

experiments:
  - structure: gv
    name: eigenmodes
    enabled: true
    geometries: [gv_rad2_height14_28, gv_rad3_height16]
    controls: [bpress_-91]

prior_ka: [0.1, 1.1]
prior_kb: [0.2, 1.2]
prior_mu: [0.3, 1.3]
prior_b1: [0.0, 3.0]
prior_b2: [0.0, 10.0]
prior_a3: [-2.5, 3.0]
prior_a4: [0.0, 4.0]
prior_mu_l: [0.8, 1.8]
prior_c: [0.9, 1.9]
prior_sigma: [0.0, 1.0]

hyperprior_mu_ka: [0.1, 1.1]
hyperprior_sigma_ka: [0.01, 0.2]
hyperprior_mu_kb: [0.2, 1.2]
hyperprior_sigma_kb: [0.01, 0.2]
hyperprior_mu_mu: [0.3, 1.3]
hyperprior_sigma_mu: [0.01, 0.2]
hyperprior_mu_b1: [0.0, 3.0]
hyperprior_sigma_b1: [0.01, 0.3]
hyperprior_mu_b2: [0.0, 10.0]
hyperprior_sigma_b2: [0.01, 0.3]
hyperprior_mu_a3: [-2.5, 3.0]
hyperprior_sigma_a3: [0.01, 0.3]
hyperprior_mu_a4: [0.0, 4.0]
hyperprior_sigma_a4: [0.01, 0.3]
hyperprior_mu_mu_l: [0.8, 1.8]
hyperprior_sigma_mu_l: [0.01, 0.2]
hyperprior_mu_c: [0.9, 1.9]
hyperprior_sigma_c: [0.01, 0.2]

hbi_pop_size: 128
hbi_burn_in: 1
hbi_target_cov: 0.6
hbi_covariance_scaling: 0.02
phase3b_pop_size: 128
phase3b_max_gen: 2
phase3b_target_cov: 0.6
phase3b_covariance_scaling: 0.02

out: out_gv_hierarchical_single_lane
description: "GV hierarchical single-lane fixture with fixed background pressure and multiple geometries."
