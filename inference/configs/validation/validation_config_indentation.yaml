# Validation Hierarchical Bayesian Inference Configuration (Indentation)
# Tiny indentation validation workflow for Vega/operator acceptance

emb_diameters:
  - 3.2
  - 5.8
  - 3.4

experiment: indentation
data_dir: indentation/evalkit/data
data_prefix: indentation_data_
data_files:
  3.2: data_morris_3.19.csv
  5.8: data_morris_5.76.csv
  3.4: data_morris_3.40.csv
surrogate_dir: indentation/surrogate/diameters

frac_diam: 0.2
use_surrogate: true
surrogate:
  backend: dnn
  predictive_mc_samples: 32
  predictive_mc_chunk_size: 8

pop_size: 256
max_gen: 2
target_cov: 0.8
covariance_scaling: 0.04

prior_Yt: [100000.0, 1000000000.0]
prior_kb: [400.0, 70000.0]
prior_b1: [0.0, 3.0]
prior_b2: [0.0, 10.0]
prior_a3: [-2.5, 3.0]
prior_a4: [0.0, 4.0]
prior_d0: [-0.5, 0.5]
prior_sigma: [0.0, 1.0]

hbi_pop_size: 256
hbi_burn_in: 1
hbi_target_cov: 0.6
hbi_covariance_scaling: 0.02

phase3b_pop_size: 256
phase3b_max_gen: 2
phase3b_target_cov: 0.6
phase3b_covariance_scaling: 0.02

hyperprior_mu_Yt: [100000.0, 1000000000.0]
hyperprior_sigma_Yt: [0.0, 500000000.0]
hyperprior_mu_kb: [400.0, 70000.0]
hyperprior_sigma_kb: [0.0, 35000.0]
hyperprior_mu_b1: [0.0, 3.0]
hyperprior_sigma_b1: [0.0, 3.0]
hyperprior_mu_b2: [0.0, 10.0]
hyperprior_sigma_b2: [0.0, 10.0]
hyperprior_mu_a3: [-2.5, 3.0]
hyperprior_sigma_a3: [0.0, 5.0]
hyperprior_mu_a4: [0.0, 4.0]
hyperprior_sigma_a4: [0.0, 4.0]
hyperprior_mu_d0: [-0.5, 0.5]
hyperprior_sigma_d0: [0.0, 0.3]

out: out_validation
debug: 0
dump: false
map_n_displacements: 8
description: "Validation: tiny-population indentation workflow for acceptance/testing"
