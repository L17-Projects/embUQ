codecov:
  require_ci_to_pass: true

ignore:
  # Optional BNN runtime/training surfaces require the `pyro-ppl` extra,
  # which is intentionally not part of the default CI test extra.
  - "src/meso_uq/surrogate/bnn.py"
  - "src/meso_uq/surrogate/bnn_training.py"
  - "compression/surrogate/scripts/emb_train_bnn.py"
  - "indentation/surrogate/scripts/emb_train_bnn.py"
  # Mirheo executable experiment sources and scheduler wrappers are validated
  # through platform-routing tests and GPU canaries, not Python line coverage.
  - "gv/**/src/**"
  - "docs/**"
  - "scripts/platforms/karolina/*.sh"
  - "scripts/platforms/vega/*.sh"
  - "scripts/platforms/vega/sbatch/**"
  - "scripts/platforms/vega/submit_gv_paper_figure_replay.sh"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
    patch:
      default:
        target: auto
        threshold: 0%

comment: false
