codecov:
  require_ci_to_pass: false

ignore:
  # Optional BNN runtime/training surfaces require the `pyro-ppl` extra,
  # which is intentionally not part of the default CI test extra.
  - "src/meso_uq/surrogate/bnn.py"
  - "src/meso_uq/surrogate/bnn_training.py"
  - "emb/compression/surrogate/scripts/emb_train_bnn.py"
  - "emb/indentation/surrogate/scripts/emb_train_bnn.py"
  # Generated outputs, notebooks, vendored trees, and runtime artifacts are
  # tracked by policy and docs, not by line coverage.
  - "docs/**"
  - "extern/**"
  - "papers/**"
  - "runtime/**"
  - "*/.ipynb_checkpoints/**"
  - "*.ipynb"
  - "_ci/**"
  - "_out/**"
  - "_runs/**"
  - "logs/**"
  # Test modules are validation assets. Patch coverage should measure product
  # code exercised by tests, not line execution inside the tests themselves.
  - "tests/**"
  # Operational platform wrappers and generated replay helpers are validated
  # by dedicated workflow tests instead of Codecov line deltas.
  - "scripts/platforms/karolina/*.sh"
  - "scripts/platforms/karolina/sbatch/**"
  - "scripts/platforms/vega/*.sh"
  - "scripts/platforms/vega/run_validation_matrix.py"
  - "scripts/platforms/vega/sbatch/**"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
    patch:
      default:
        target: auto
        threshold: 0%
        informational: true

comment: false
